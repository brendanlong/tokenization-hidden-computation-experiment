# Generic SkyPilot task for reproducing this experiment on a cloud GPU.
#
#   sky launch skypilot/reproduce.yaml --infra <your-cloud> --down -y
#
# Or run one command instead of the full script:
#
#   sky launch skypilot/reproduce.yaml --infra <your-cloud> --down -y \
#       --env RUN_CMD="uv run python -m retok.phase2_probe --model gpt2 \
#                      --dtype auto --jsonl-out out/gpt2.jsonl"
#
# `--down` tears the cluster down when the task finishes. Results are written
# under the working directory on the remote host — copy anything you want to
# keep back with `sky rsync` or add your own upload step to `run`.

name: retok-reproduce

resources:
  # Any of these will do. The toy training runs fit in 8 GB; Phase-2
  # generation needs enough VRAM for the model under test (A40/A100 covers
  # everything including gpt-oss-20b at ~44 GB).
  accelerators: {A40:1, A100:1, A10G:1, L4:1, RTX3090:1, A100-80GB:1}
  disk_size: 100
  # On-demand by default: this is an unmanaged task, so a spot preemption
  # would lose the run with no retry and no way to fetch results. Set
  # `use_spot: true` (cheaper) only if you're willing to redo the work, or
  # use `sky jobs launch` instead, which handles recovery.

workdir: .

envs:
  # Override to run a single command instead of the full training script.
  RUN_CMD: ""
  # Optional. Empty defaults keep these genuinely optional: setting a value to
  # `null` instead would make SkyPilot *require* it and abort the launch.
  # Pass with e.g. `--env WANDB_API_KEY=...` (or --secret, to keep it out of logs).
  WANDB_API_KEY: ""
  HF_TOKEN: ""

setup: |
  pip install uv
  uv sync

run: |
  set -euo pipefail
  # Some GPU images (e.g. RunPod's) set HF_HUB_ENABLE_HF_TRANSFER=1 globally,
  # but this project's environment does not ship hf_transfer — every HF
  # download would then fail outright rather than fall back.
  export HF_HUB_ENABLE_HF_TRANSFER=0
  nvidia-smi
  # Some cloud hosts run NVIDIA drivers older than the locked torch wheel's
  # CUDA runtime (e.g. RunPod A40s on driver 570 vs a cu130 wheel), in which
  # case torch reports cuda_available=False and everything silently crawls on
  # CPU. Fall back to the cu128 build — swapping the whole nvidia-* set, since
  # mixing cu12/cu13 companion libs breaks torch's NCCL symbols — and stop
  # `uv run` from re-syncing the locked wheel back over it.
  if ! uv run python -c 'import sys, torch; sys.exit(0 if torch.cuda.is_available() else 1)'; then
    echo ">>> torch cannot see CUDA (driver too old for the locked wheel?); installing the cu128 build"
    (uv pip list | grep -E '^(nvidia|torch|triton)' || true) | awk '{print $1}' | xargs -r uv pip uninstall
    uv pip install torch --index-url https://download.pytorch.org/whl/cu128
    export UV_NO_SYNC=1
    uv run python -c 'import torch; assert torch.cuda.is_available(), "still no CUDA after cu128 fallback"'
  fi
  if [ -n "${WANDB_API_KEY:-}" ]; then
    uv run wandb login "$WANDB_API_KEY"
  else
    export WANDB_MODE=disabled
  fi
  if [ -n "${HF_TOKEN:-}" ]; then
    uv run huggingface-cli login --token "$HF_TOKEN"
  fi
  eval "${RUN_CMD:-bash scripts/reproduce_training.sh}"
